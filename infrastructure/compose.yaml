name: gas-monitor
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gas_monitor
      POSTGRES_USER: gas_monitor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/configure-local.py first}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gas_monitor -d gas_monitor"]
      interval: 3s
      timeout: 3s
      retries: 20
  broker:
    image: eclipse-mosquitto:2
    ports: ["127.0.0.1:1883:1883"]
    volumes: ["./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro"]
  backend:
    build: ../backend
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      db: {condition: service_healthy}
      broker: {condition: service_started}
    environment:
      HOST: 0.0.0.0
      DATABASE_URL: postgres://gas_monitor:${POSTGRES_PASSWORD}@db:5432/gas_monitor
      MIGRATE_ON_START: "true"
      MQTT_URL: ${MQTT_URL:-mqtt://broker:1883}
      MQTT_USER: ${MQTT_USER:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      WEB_ORIGIN: http://localhost:8080
      APP_TOKEN: ${APP_TOKEN:-}
      NOTIFICATIONS_ENABLED: ${NOTIFICATIONS_ENABLED:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
  frontend:
    build:
      context: ../frontend
      args:
        VITE_API_URL: http://localhost:3000
    ports: ["127.0.0.1:8080:8080"]
    depends_on: [backend]
volumes:
  postgres_data:
